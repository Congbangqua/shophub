version: "1"
services:
- type: web
  name: shophub_api
  runtime: python
  repo: https://github.com/Congbangqua/shophub
  plan: free
  envVars:
  - key: GHN_API_URL
    sync: false
  - key: GHN_SHOP_ID
    sync: false
  - key: GHN_API_TOKEN
    sync: false
  - key: DATABASE_URL
    sync: false
  - key: PYTHONUNBUFFERED
    sync: false
  - key: VNPAY_RETURN_URL
    sync: false
  - key: VNPAY_BASE_URL
    sync: false
  - key: STRIPE_SUCCESS_URL
    sync: false
  - key: STRIPE_CANCEL_URL
    sync: false
  - key: PAYPAL_RETURN_URL
    sync: false
  - key: PAYPAL_CANCEL_URL
    sync: false
  - key: VNPAY_HASH_SECRET
    sync: false
  - key: VNPAY_TMN_CODE
    sync: false
  - key: PAYPAL_API_BASE
    sync: false
  - key: PAYPAL_CLIENT_SECRET
    sync: false
  - key: PAYPAL_CLIENT_ID
    sync: false
  - key: STRIPE_SECRET_KEY
    sync: false
  region: singapore
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
  autoDeployTrigger: commit
  rootDir: backend
